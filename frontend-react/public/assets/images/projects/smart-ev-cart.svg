<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="ev-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" rx="16" fill="url(#ev-bg)"/>
  <rect width="600" height="360" rx="16" fill="url(#grid)"/>

  <!-- Radar circle / GPS pulse -->
  <circle cx="480" cy="90" r="45" fill="none" stroke="#00f0ff" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
  <circle cx="480" cy="90" r="25" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.6"/>
  <circle cx="480" cy="90" r="6" fill="#00f0ff" filter="url(#neon)"/>
  <text x="480" y="150" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11" text-anchor="middle" letter-spacing="1.5">GPS TELEMETRY</text>

  <!-- RFID Scanner Graphic Left -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="70" height="50" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <path d="M 20 25 A 15 15 0 0 1 50 25" fill="none" stroke="#00f0ff" stroke-width="2"/>
    <path d="M 26 28 A 9 9 0 0 1 44 28" fill="none" stroke="#00f0ff" stroke-width="2"/>
    <circle cx="35" cy="32" r="2" fill="#00f0ff"/>
    <text x="35" y="72" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle" letter-spacing="1">RFID AUTH</text>
  </g>

  <!-- Ground Line -->
  <line x1="50" y1="280" x2="550" y2="280" stroke="#334155" stroke-width="2"/>
  <line x1="120" y1="280" x2="480" y2="280" stroke="#00f0ff" stroke-width="2" filter="url(#neon)" opacity="0.7"/>

  <!-- EV Cart Silhouette / Stylized Wireframe -->
  <g transform="translate(140, 140)">
    <!-- Chassis & Body -->
    <path d="M 30 110 L 60 110 L 80 50 L 220 50 L 260 110 L 300 110 C 310 110 320 120 320 130 L 20 130 C 20 120 25 110 30 110 Z" 
          fill="#111827" stroke="url(#cyan-glow)" stroke-width="2.5" filter="url(#neon)"/>
    
    <!-- Windshield & Roof Frame -->
    <path d="M 90 50 L 120 10 L 200 10 L 215 50" fill="none" stroke="#00f0ff" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Roll Cage / Canopy Structure -->
    <line x1="150" y1="10" x2="150" y2="50" stroke="#38bdf8" stroke-width="1.5"/>
    
    <!-- Wheels -->
    <g transform="translate(75, 125)">
      <circle cx="0" cy="0" r="24" fill="#0f172a" stroke="#00f0ff" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="3" fill="#00f0ff"/>
    </g>
    <g transform="translate(255, 125)">
      <circle cx="0" cy="0" r="24" fill="#0f172a" stroke="#00f0ff" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="3" fill="#00f0ff"/>
    </g>

    <!-- Battery Indicator on Vehicle -->
    <rect x="135" y="75" width="55" height="26" rx="4" fill="#090d16" stroke="#10b981" stroke-width="1.5"/>
    <rect x="140" y="79" width="35" height="18" rx="2" fill="#10b981" opacity="0.8"/>
    <path d="M 191 84 L 193 84 C 194 84 194 85 194 86 L 194 90 C 194 91 194 92 193 92 L 191 92" stroke="#10b981" stroke-width="1.5" fill="none"/>
    <text x="157" y="93" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10" font-weight="700">88%</text>

    <!-- Sensor / Headlight Beam -->
    <polygon points="318,118 420,95 420,135 318,125" fill="url(#cyan-glow)" opacity="0.12"/>
    <line x1="318" y1="120" x2="410" y2="105" stroke="#00f0ff" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>
  </g>

  <!-- Project Badge -->
  <rect x="30" y="305" width="230" height="28" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
  <circle cx="45" cy="319" r="4" fill="#10b981"/>
  <text x="58" y="323" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">SMART EV MOBILITY SYSTEM</text>
</svg>