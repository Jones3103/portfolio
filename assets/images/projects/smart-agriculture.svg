<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="agri-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06130d" />
      <stop offset="100%" stop-color="#0c2317" />
    </linearGradient>
    <linearGradient id="neon-green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="soil-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" rx="16" fill="url(#agri-bg)"/>

  <!-- Field Terrain Matrix Grid -->
  <path d="M 0 240 Q 150 220 300 240 T 600 230 L 600 360 L 0 360 Z" fill="url(#soil-grad)"/>
  <path d="M 0 240 Q 150 220 300 240 T 600 230" fill="none" stroke="#10b981" stroke-width="2" opacity="0.6"/>

  <!-- Circuit roots in soil -->
  <path d="M 300 240 L 300 280 L 260 300 L 260 320" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7"/>
  <circle cx="260" cy="320" r="3" fill="#10b981"/>
  
  <path d="M 300 280 L 340 300 L 380 300" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7"/>
  <circle cx="380" cy="300" r="3" fill="#10b981"/>

  <!-- Central Smart Sensor Station / Probe -->
  <g transform="translate(300, 140)">
    <!-- Main Mast -->
    <line x1="0" y1="0" x2="0" y2="100" stroke="#00f0ff" stroke-width="3" filter="url(#glow-green)"/>
    
    <!-- Microcontroller enclosure -->
    <rect x="-30" y="20" width="60" height="45" rx="6" fill="#111827" stroke="#10b981" stroke-width="2"/>
    <circle cx="-15" cy="35" r="4" fill="#34d399"/>
    <circle cx="0" cy="35" r="4" fill="#00f0ff"/>
    <circle cx="15" cy="35" r="4" fill="#3b82f6"/>
    <line x1="-20" y1="50" x2="20" y2="50" stroke="#374151" stroke-width="2"/>

    <!-- Solar Panel at Top -->
    <polygon points="-45,-5 45,-5 35,-22 -35,-22" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="0" y1="-22" x2="0" y2="-5" stroke="#38bdf8" stroke-width="1"/>
    <line x1="-20" y1="-22" x2="-20" y2="-5" stroke="#38bdf8" stroke-width="0.8"/>
    <line x1="20" y1="-22" x2="20" y2="-5" stroke="#38bdf8" stroke-width="0.8"/>

    <!-- Antenna & Signal broadcast waves -->
    <line x1="0" y1="-22" x2="0" y2="-38" stroke="#10b981" stroke-width="2"/>
    <circle cx="0" cy="-38" r="3" fill="#34d399" filter="url(#glow-green)"/>
    <path d="M -15 -42 A 15 15 0 0 1 15 -42" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M -25 -48 A 25 25 0 0 1 25 -48" fill="none" stroke="#10b981" stroke-width="1.2" opacity="0.6"/>
  </g>

  <!-- Holographic Plant Sprout Growing -->
  <g transform="translate(160, 190)">
    <!-- Sprout Stem -->
    <path d="M 0 50 Q 5 20 -15 0" fill="none" stroke="#34d399" stroke-width="3" filter="url(#glow-green)"/>
    <!-- Left Leaf -->
    <path d="M -15 0 C -35 -10 -40 10 -15 0 Z" fill="#10b981" opacity="0.85"/>
    <!-- Right Leaf -->
    <path d="M -5 18 C 15 10 20 28 -5 18 Z" fill="#059669" opacity="0.85"/>
    <!-- Moisture droplets -->
    <circle cx="-25" cy="-5" r="2.5" fill="#00f0ff"/>
    <circle cx="15" cy="15" r="2" fill="#00f0ff"/>
  </g>

  <!-- Live Telemetry Monitor Floating Panel -->
  <g transform="translate(420, 60)">
    <rect x="0" y="0" width="145" height="110" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="145" height="24" rx="8" fill="#1e293b"/>
    <text x="12" y="16" fill="#34d399" font-family="'Inter', sans-serif" font-size="10" font-weight="700">LIVE SENSOR TELEMETRY</text>
    
    <!-- Soil Moisture metric -->
    <text x="12" y="42" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9">Soil Moisture:</text>
    <text x="125" y="42" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="end">64%</text>
    <rect x="12" y="48" width="120" height="5" rx="2.5" fill="#1e293b"/>
    <rect x="12" y="48" width="77" height="5" rx="2.5" fill="#38bdf8"/>

    <!-- Ambient Temp metric -->
    <text x="12" y="70" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9">Temp &amp; Humidity:</text>
    <text x="125" y="70" fill="#f59e0b" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="end">28°C / 58%</text>

    <!-- Irrigation status -->
    <text x="12" y="94" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="9">Auto Irrigation:</text>
    <text x="125" y="94" fill="#10b981" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="end">READY</text>
  </g>

  <!-- Tag / Title Pill -->
  <rect x="30" y="305" width="220" height="28" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
  <circle cx="45" cy="319" r="4" fill="#10b981"/>
  <text x="58" y="323" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">SMART AGRI-TECH IOT</text>
</svg>
