<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="vr-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080e1c" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="vr-cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <pattern id="grid-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#1e293b"/>
    </pattern>
    <filter id="glow-vr" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" rx="16" fill="url(#vr-bg)"/>
  <rect width="600" height="360" rx="16" fill="url(#grid-dots)"/>

  <!-- 360 Sphere wireframe -->
  <g transform="translate(300, 160)">
    <!-- Globe Equators and Meridians -->
    <ellipse cx="0" cy="0" rx="140" ry="80" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <ellipse cx="0" cy="0" rx="140" ry="40" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="4 4"/>
    <ellipse cx="0" cy="0" rx="70" ry="80" fill="none" stroke="#1e293b" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="140" fill="none" stroke="#0284c7" stroke-width="1.5" opacity="0.4"/>
    
    <!-- 360 panorama horizon line -->
    <path d="M -140 0 C -70 -25, 70 25, 140 0" fill="none" stroke="#00f0ff" stroke-width="2" filter="url(#glow-vr)" opacity="0.8"/>

    <!-- Campus Building Silhouettes in Panorama Projection -->
    <path d="M -100 0 L -100 -35 L -70 -35 L -70 -20 L -40 -20 L -40 -45 L -10 -45 L -10 -10 L 20 -10 L 20 -50 L 50 -50 L 50 -25 L 90 -25 L 90 0" 
          fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>

    <!-- Interactive Hotspots (Pulsing Beacons) -->
    <!-- Hotspot 1 -->
    <g transform="translate(-55, -25)">
      <circle cx="0" cy="0" r="12" fill="none" stroke="#00f0ff" stroke-width="1.2" opacity="0.6"/>
      <circle cx="0" cy="0" r="5" fill="#00f0ff" filter="url(#glow-vr)"/>
      <line x1="0" y1="-8" x2="0" y2="-22" stroke="#00f0ff" stroke-width="1"/>
      <rect x="-42" y="-38" width="84" height="16" rx="4" fill="#0f172a" stroke="#00f0ff" stroke-width="1"/>
      <text x="0" y="-26" fill="#e0f2fe" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle" font-weight="600">LAB BLOCK</text>
    </g>

    <!-- Hotspot 2 -->
    <g transform="translate(45, -40)">
      <circle cx="0" cy="0" r="12" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.6"/>
      <circle cx="0" cy="0" r="5" fill="#38bdf8" filter="url(#glow-vr)"/>
      <line x1="0" y1="-8" x2="0" y2="-20" stroke="#38bdf8" stroke-width="1"/>
      <rect x="-44" y="-36" width="88" height="16" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="0" y="-24" fill="#e0f2fe" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle" font-weight="600">MAIN AUDITORIUM</text>
    </g>

    <!-- VR Headset Icon Floating Bottom Center -->
    <g transform="translate(0, 75)">
      <rect x="-35" y="-18" width="70" height="36" rx="10" fill="#0f172a" stroke="url(#vr-cyan)" stroke-width="2" filter="url(#glow-vr)"/>
      <rect x="-26" y="-10" width="20" height="20" rx="4" fill="#0284c7" opacity="0.5"/>
      <rect x="6" y="-10" width="20" height="20" rx="4" fill="#0284c7" opacity="0.5"/>
      <circle cx="-16" cy="0" r="4" fill="#ffffff" opacity="0.9"/>
      <circle cx="16" cy="0" r="4" fill="#ffffff" opacity="0.9"/>
      <!-- Headband -->
      <path d="M -35 -2 C -50 -2, -50 0, -50 0" stroke="#475569" stroke-width="3" fill="none"/>
      <path d="M 35 -2 C 50 -2, 50 0, 50 0" stroke="#475569" stroke-width="3" fill="none"/>
    </g>
  </g>

  <!-- Compass / 360 Degree Indicator -->
  <g transform="translate(80, 70)">
    <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="0" y="-14" fill="#00f0ff" font-family="'Inter', sans-serif" font-size="8" font-weight="700" text-anchor="middle">N</text>
    <text x="17" y="3" fill="#64748b" font-family="'Inter', sans-serif" font-size="8" text-anchor="middle">E</text>
    <text x="0" y="20" fill="#64748b" font-family="'Inter', sans-serif" font-size="8" text-anchor="middle">S</text>
    <text x="-17" y="3" fill="#64748b" font-family="'Inter', sans-serif" font-size="8" text-anchor="middle">W</text>
    <polygon points="0,-10 4,2 -4,2" fill="#00f0ff"/>
    <polygon points="0,10 4,2 -4,2" fill="#475569"/>
    <text x="0" y="42" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle" letter-spacing="1">360° SPATIAL</text>
  </g>

  <!-- Tag / Title Pill -->
  <rect x="30" y="305" width="220" height="28" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
  <circle cx="45" cy="319" r="4" fill="#38bdf8"/>
  <text x="58" y="323" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">VR IMMERSIVE CAMPUS TOUR</text>
</svg>
