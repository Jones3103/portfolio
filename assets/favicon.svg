<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0b0f19" />
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#cyber-grad)" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6"/>
  <!-- Circuit Nodes -->
  <circle cx="16" cy="16" r="3" fill="#00f0ff" />
  <line x1="16" y1="16" x2="26" y2="26" stroke="#00f0ff" stroke-width="1.5" opacity="0.8" />
  <circle cx="48" cy="16" r="3" fill="#3b82f6" />
  <line x1="48" y1="16" x2="38" y2="26" stroke="#3b82f6" stroke-width="1.5" opacity="0.8" />
  <!-- Stylized J letterform robotic hexagon -->
  <path d="M 22 22 L 42 22 L 42 38 C 42 45 36 49 28 49 C 22 49 18 46 18 42 L 24 42 C 24 44 26 45 28 45 C 32 45 35 43 35 38 L 35 28 L 22 28 Z" fill="url(#cyber-grad)" filter="url(#glow)"/>
</svg>
